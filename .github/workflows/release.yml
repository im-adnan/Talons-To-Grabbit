name: Auto Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update plugin.json Version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" plugin/plugin.json

      - name: Fetch Fresh Upstream yt-dlp
        run: |
          chmod +x build/fetch-ytdlp.sh
          ./build/fetch-ytdlp.sh

      - name: Build Talons Plugin
        run: |
          chmod +x build/build.sh
          ./build/build.sh

      - name: Get Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Talons Release v${{ env.VERSION }}
          files: build/talons.gda
          body: |
            ## 🦅 Talons Media Extractor Release v${{ env.VERSION }}
            Automated build for Grabbit on macOS Apple Silicon (ARM64).
            
            **Installation**:
            1. Download `talons.gda`.
            2. In **Grabbit**, navigate to **Settings** -> **Plugins** -> **Install Plugin**.
            3. Select `talons.gda` to install or update.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
