<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="talonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="clawTipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Glowing Download Stream Beam -->
  <path d="M64 24 L64 74" stroke="url(#beamGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M50 60 L64 76 L78 60" fill="none" stroke="url(#beamGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Talons / Claws (Gripping Downward) -->
  <!-- Left Talon Outer -->
  <path d="M30 46 C34 58, 42 72, 54 78 C51 70, 48 58, 42 46 Z" fill="url(#talonGrad)" />
  <path d="M54 78 C52 75, 49 71, 48 67" stroke="url(#clawTipGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Left Talon Inner -->
  <path d="M44 42 C48 56, 56 68, 62 74 C59 66, 56 56, 52 42 Z" fill="url(#talonGrad)" />
  <path d="M62 74 C60 70, 58 66, 57 62" stroke="url(#clawTipGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Right Talon Inner -->
  <path d="M84 42 C80 56, 72 68, 66 74 C69 66, 72 56, 76 42 Z" fill="url(#talonGrad)" />
  <path d="M66 74 C68 70, 70 66, 71 62" stroke="url(#clawTipGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Right Talon Outer -->
  <path d="M98 46 C94 58, 86 72, 74 78 C77 70, 80 58, 86 46 Z" fill="url(#talonGrad)" />
  <path d="M74 78 C76 75, 79 71, 80 67" stroke="url(#clawTipGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Central Grasp Pearl / Core -->
  <circle cx="64" cy="88" r="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="64" cy="88" r="3.5" fill="#ffffff" />
</svg>
